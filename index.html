<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Business Name</title>
<style>
  :root {
    --ink: #14213d;
    --accent: #e2703a;
    --bg: #fdfaf6;
    --bubble-bot: #f1ede6;
    --bubble-user: #14213d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ---- Simple landing page content ---- */
  header {
    padding: 60px 20px 40px;
    text-align: center;
  }
  header h1 {
    font-size: 32px;
    margin-bottom: 12px;
  }
  header p {
    font-size: 17px;
    opacity: 0.75;
    max-width: 480px;
    margin: 0 auto;
  }

  .hint {
    margin: 30px auto 0;
    text-align: center;
    padding: 14px 22px;
    background: white;
    border: 1px solid #eae4da;
    border-radius: 14px;
    max-width: 320px;
    font-size: 14px;
    color: var(--ink);
    opacity: 0.8;
  }

  footer {
    margin-top: auto;
    text-align: center;
    padding: 24px;
    font-size: 12px;
    opacity: 0.4;
  }

  /* ---- Chat widget ---- */
  #launcher {
    position: fixed; bottom: 20px; right: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; border: none;
    box-shadow: 0 6px 20px rgba(20,33,61,0.25);
    z-index: 9999;
  }
  #panel {
    position: fixed; bottom: 92px; right: 20px;
    width: 340px; max-width: 92vw; height: 480px; max-height: 75vh;
    background: var(--bg); border-radius: 16px;
    box-shadow: 0 12px 40px rgba(20,33,61,0.25);
    display: none; flex-direction: column; overflow: hidden;
    z-index: 9999;
  }
  #panel.open { display: flex; }
  #header { background: var(--ink); color: white; padding: 16px; font-weight: 600; font-size: 15px; }
  #header span { display: block; font-weight: 400; font-size: 12px; opacity: 0.7; margin-top: 2px; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .msg.bot { background: var(--bubble-bot); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--bubble-user); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.error { background: #fdecea; color: #a12622; align-self: flex-start; font-family: monospace; font-size: 12px; }
  #inputRow { display: flex; padding: 10px; gap: 8px; border-top: 1px solid #eae4da; }
  #textInput { flex: 1; border: 1px solid #ddd5c7; border-radius: 20px; padding: 10px 14px; font-size: 14px; outline: none; }
  #sendBtn { background: var(--accent); color: white; border: none; border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .optionsRow { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 10px; }
  .optionBtn {
    background: white; color: var(--ink); border: 1.5px solid var(--accent);
    border-radius: 16px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .optionBtn:hover { background: var(--accent); color: white; }

  @media (max-width: 480px) {
    header h1 { font-size: 26px; }
    header { padding: 40px 20px 24px; }
  }
</style>
</head>
<body>

<header>
  <h1>Client Business Name</h1>
  <p>Short tagline goes here — what you do and who you help, in one line.</p>
</header>

<div class="hint">👋 Tap the chat bubble in the corner to get started</div>

<footer>Powered by AssistQ</footer>

<button id="launcher">💬</button>

<div id="panel">
  <div id="header">
    Chat with us
    <span id="subheader">Usually replies in a few seconds</span>
  </div>
  <div id="messages"></div>
  <div id="optionsContainer"></div>
  <div id="inputRow">
    <input id="textInput" type="text" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
// ============ CONFIG — edit these for each client ============
const CONFIG = {
  webhookUrl: "https://script.google.com/macros/s/AKfycbyZddoCVD7M1bnjFzmaP_6c_JdLr6T02z-PB_KC82-G1UQDSrVr08JpTo-StU37iGBT/exec",  // must end in /exec
  businessName: "ASSISTQ",
  greeting: "Welcome to AssistQ. I'm here to help answer your questions about our lead-generation services and connect you with the right person on our team. To get started, could I get your name?",

  // Must be in the SAME ORDER as the backend's CONFIG.questions.
  // Give a question "options" to show quick-tap buttons instead of typing.
  // Leave options as null for free-text questions like name/phone.
  questions: [
    { key: "name",  options: null },
    { key: "phone", options: null },
    { key: "need",  options: ["AI Assistant", "Smart Form", "Selling", "Just browsing"] },
    { key: "budget", options: ["Under ₹2000", "4000", "5000", "6000"] }
  ]
};
// ================================================================

let conversation = [];
let knownFields = {};
let isComplete = false;
const leadId = "lead_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

const launcher = document.getElementById("launcher");
const panel = document.getElementById("panel");
const messagesEl = document.getElementById("messages");
const optionsContainer = document.getElementById("optionsContainer");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

launcher.addEventListener("click", () => {
  panel.classList.toggle("open");
  if (conversation.length === 0) {
    addMessage("bot", CONFIG.greeting);
    conversation.push({ role: "assistant", content: CONFIG.greeting });
    showOptionsIfAny();
  }
});

sendBtn.addEventListener("click", () => sendMessage());
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

function addMessage(sender, text) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showOptionsIfAny() {
  optionsContainer.innerHTML = "";
  const nextQ = CONFIG.questions.find(q => !knownFields[q.key]);
  if (!nextQ || !nextQ.options) return;

  const row = document.createElement("div");
  row.className = "optionsRow";
  nextQ.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "optionBtn";
    btn.textContent = opt;
    btn.onclick = () => sendMessage(opt);
    row.appendChild(btn);
  });
  optionsContainer.appendChild(row);
}

async function sendMessage(optionText) {
  const text = optionText || textInput.value.trim();
  if (!text || isComplete) return;

  optionsContainer.innerHTML = "";
  addMessage("user", text);
  conversation.push({ role: "user", content: text });
  textInput.value = "";
  sendBtn.disabled = true;

  const typingEl = addMessage("bot", "...");

  try {
    const res = await fetch(CONFIG.webhookUrl, {
      method: "POST",
      body: JSON.stringify({ action: "chat", leadId: leadId, messages: conversation, knownFields: knownFields })
    });

    const rawText = await res.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch (parseErr) {
      typingEl.remove();
      addMessage("error", "Backend didn't return JSON. Raw response:\n" + rawText.slice(0, 300));
      sendBtn.disabled = false;
      return;
    }

    if (data.status === "error") {
      typingEl.remove();
      addMessage("error", "Backend error: " + data.message);
      sendBtn.disabled = false;
      return;
    }

    typingEl.remove();
    addMessage("bot", data.reply);
    conversation.push({ role: "assistant", content: data.reply });
    knownFields = data.fields || knownFields;

    if (data.complete && !isComplete) {
      isComplete = true;
      await submitLead();
    } else {
      showOptionsIfAny();
    }

  } catch (err) {
    typingEl.remove();
    addMessage("error", "Request failed: " + err.message + " (check the webhookUrl and your internet connection)");
  }

  sendBtn.disabled = false;
  textInput.focus();
}

async function submitLead() {
  try {
    const res = await fetch(CONFIG.webhookUrl, {
      method: "POST",
      body: JSON.stringify({ action: "submit", leadId: leadId, fields: knownFields })
    });
    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch (e) { data = null; }

    if (!data || data.status !== "success") {
      addMessage("error", "Lead submit failed: " + (data ? data.message : rawText.slice(0, 300)));
    } else {
      addMessage("bot", "✅ Saved! Thanks — we'll be in touch shortly.");
    }
  } catch (err) {
    addMessage("error", "Submit request failed: " + err.message);
  }
}
</script>

</body>
</html>
